<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>FIM DA PICADA</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:#e11;font-family:'Courier New',monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;font-size:20px;font-weight:700;z-index:5;pointer-events:none;text-shadow:2px 0 #0ff,-2px 0 #f00}
#joy{position:fixed;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(200,0,0,.12);border:2px solid rgba(200,0,0,.6);z-index:4}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#600;border:2px solid #f22}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:10;text-align:center;padding:20px}
#msg h1{font-size:34px;margin:0 0 12px;text-shadow:3px 0 #0ff,-3px 0 #f00;animation:j .3s steps(2) infinite}
#msg p{margin:0 0 22px;font-size:16px;max-width:310px;color:#c88;line-height:1.4}
#msg button{font:700 22px 'Courier New',monospace;padding:14px 30px;border:2px solid #d11;background:#000;color:#d11}
@keyframes j{50%{transform:translate(2px,-1px) skewX(4deg)}}
</style></head><body>
<div id="hud"><span id="d">0m</span><span id="f"></span></div>
<canvas id="c"></canvas>
<div id="joy"><div id="knob"></div></div>

const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let jx=0,jy=0,act=null;
function mv(e){const r=joy.getBoundingClientRect(),cx=r.left+65,cy=r.top+65;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}jx=dx/m;jy=dy/m;knob.style.left=35+dx+'px';knob.style.top=35+dy+'px'}
function end(){act=null;jx=jy=0;knob.style.left='35px';knob.style.top='35px'}
joy.addEventListener('pointerdown',e=>{act=e.pointerId;joy.setPointerCapture(e.pointerId);mv(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===act)mv(e)});
joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);

let ac,mg,nb,sir,sg,seq=0,mt,musOn=false,bpm=150;
function initA(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
mg=ac.createGain();mg.gain.value=.5;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination);
nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
sir=ac.createOscillator();sir.type='triangle';sg=ac.createGain();sg.gain.value=0;sir.connect(sg);sg.connect(mg);sir.start()}catch(e){}}
function note(f,t,d,ty,v){try{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function kick(t,v){try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.22)}catch(e){}}
function hat(t,v){try{const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+.06)}catch(e){}}
function scream(d){try{const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;s.loop=true;f.type='bandpass';f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2600,t+d);f.Q.value=2;g.gain.setValueAtTime(.6,t);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d);
const o=ac.createOscillator(),og=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(2400,t+d);og.gain.setValueAtTime(.25,t);og.gain.linearRampToValueAtTime(0,t+d);o.connect(og);og.connect(mg);o.start(t);o.stop(t+d)}catch(e){}}
const BASS=[0,0,1,0,0,0,6,0,0,1,0,0,6,0,7,0],LEAD=[0,1,6,7,13,12];
let K=0,PR=0;
function tick(){if(!musOn)return;try{const t=ac.currentTime+.05,s=seq%16;
note(55*Math.pow(2,BASS[s]/12),t,.11,'sawtooth',.22);
if(s%4===0||(K>0&&s%4===2))kick(t,.55);
hat(t,s%2?.12:.05);
if(Math.random()<.3+K*.35)note(220*Math.pow(2,LEAD[Math.floor(Math.random()*6)]/12)*(Math.random()<.3?2:1),t,.12,'square',.05);
if(s===0||s===3)note(48,t,.18,'sine',.5);
if(K>0&&s===8){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1000,t);o.frequency.exponentialRampToValueAtTime(2100,t+.45);g.gain.setValueAtTime(.07,t);g.gain.linearRampToValueAtTime(0,t+.45);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.5)}
}catch(e){}seq++;bpm=145+PR*55+K*25;mt=setTimeout(tick,60/bpm/4*1000)}
function music(on){musOn=on;clearTimeout(mt);if(on)tick();else try{sg.gain.value=0}catch(e){}}

const L=22000,T=L*.45,words=['CORRE','NÃO OLHA PRA TRÁS','SIGMA','OHIO','TUNG TUNG TUNG','SKIBIDI','FIM DA PICADA','03:33','AINDA ACORDADO?','ele te vê'];
let st='menu',dist,px,P,gap,slow,inv,ob,tr,trT,shake,flash,txt,txtT,nextTxt,last,scT,why;
const asp=()=>img.naturalHeight/img.naturalWidth||1;
function start(){initA();dist=0;px=W*.42;P={y:0,vy:0,sl:false};gap=260;slow=0;inv=0;tr=false;trT=0;shake=0;flash=0;txt='';txtT=0;nextTxt=4;K=0;PR=0;seq=0;
ob=[];let o=900;while(o<L-700){ob.push({x:o,t:Math.floor(Math.random()*3)});o+=R(430,780)}
st='run';last=performance.now();document.getElementById('msg').style.display='none';music(true)}
document.getElementById('go').onclick=start;
function scare(w){st='scare';scT=0;why=w;music(false);scream(2)}
function man(time){const X=px,Y=G-P.y,r=Math.sin(time*16)*(P.y>0?.25:1);x.save();x.shadowColor='rgba(255,225,210,.75)';x.shadowBlur=7;x.strokeStyle='#4b2a18';x.fillStyle='#4b2a18';x.lineWidth=5;x.lineCap='round';
const ln=(a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()};
if(P.sl){x.fillStyle='#160a04';x.beginPath();x.arc(X+22,Y-18,11,0,7);x.fill();x.fillStyle='#4b2a18';x.beginPath();x.arc(X+23,Y-11,8,0,7);x.fill();ln(X-22,Y-8,X+16,Y-8);ln(X-22,Y-8,X-42,Y-3+r*3);ln(X-22,Y-8,X-38,Y-14);ln(X+8,Y-8,X+30,Y-4+r*3)}
else{const hy=Y-32,ny=Y-58;x.fillStyle='#160a04';x.beginPath();x.arc(X+1,ny-17,13,0,7);x.fill();x.fillStyle='#4b2a18';x.beginPath();x.arc(X+2,ny-10,10,0,7);x.fill();
x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(X+6,ny-12,2,0,7);x.fill();x.shadowBlur=7;
ln(X,ny,X,hy);ln(X,hy,X+r*14,Y-14);ln(X+r*14,Y-14,X+r*18-4,Y);ln(X,hy,X-r*14,Y-14);ln(X-r*14,Y-14,X-r*18-4,Y);
ln(X,ny+6,X-r*12,Y-38);ln(X-r*12,Y-38,X-r*20,Y-30);ln(X,ny+6,X+r*12,Y-38);ln(X+r*12,Y-38,X+r*20,Y-30)}
x.restore()}
function chaser(time,k){const cx=px-gap,hh=Math.min(L_(120,H*.52,k),W*.85*asp()),hw=hh/asp(),cy=L_(G-100+Math.sin(time*9)*8,hh/2+H*.04,k),jt=2+k*14;
x.save();
if(k>.1){x.globalAlpha=Math.min(1,k*1.5);x.fillStyle='#050000';x.beginPath();x.moveTo(cx-hw*.3,cy+hh*.4);x.lineTo(cx+hw*.3,cy+hh*.4);x.lineTo(cx+hw*.6,G);x.lineTo(cx-hw*.6,G);x.fill();
x.strokeStyle='#600';x.lineWidth=2;for(let i=0;i<6;i++){const yy=cy+hh*.55+i*(G-cy-hh*.55)/6;x.beginPath();x.moveTo(cx-hw*.3,yy);x.lineTo(cx+hw*.3,yy+Math.sin(time*5+i)*5);x.stroke()}
for(const sd of[-1,1]){const sx=cx+sd*hw*.28,sy=cy+hh*.5,hx=px-25+sd*20,hy=G-45+Math.sin(time*7+sd)*22,mx=(sx+hx)/2,my=Math.max(sy,hy)+hh*.25;
x.shadowColor='#f00';x.shadowBlur=14;x.strokeStyle='#0a0000';x.lineWidth=6+k*16;x.lineCap='round';x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(mx,my,hx,hy);x.stroke();
x.lineWidth=3;x.shadowBlur=0;for(let f=0;f<4;f++){x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+14+f*6,hy-18+f*10+Math.sin(time*12+f)*6);x.stroke()}}
x.globalAlpha=1}
x.shadowColor='#f00';x.shadowBlur=30*k+10;
const sl=10,dh=hh/sl,sh=img.naturalHeight/sl;
for(let i=0;i<sl;i++){x.drawImage(img,0,i*sh,img.naturalWidth,sh+1,cx-hw/2+Math.sin(time*6+i*.8)*jt,cy-hh/2+i*dh,hw,dh+1)}
if(k>.4){x.shadowBlur=10;[[-.28,.95,.3,-.3],[.3,1.15,.22,.4]].forEach(a=>{x.save();x.translate(cx+hw*a[0],cy+hh*a[1]);x.rotate(a[3]+Math.sin(time*3)*.1);x.globalAlpha=.85;x.drawImage(img,-hw*a[2]/2,-hh*a[2]/2,hw*a[2],hh*a[2]);x.restore()})}
x.restore()}
function loop(now){requestAnimationFrame(loop);if(st==='menu'){x.fillStyle='#120000';x.fillRect(0,0,W,H);return}
const dt=Math.min((now-last)/1000,.05);last=now;const time=now/1000;
if(st==='run'){
PR=dist/L;let ax=jx,ay=jy;if(keys.ArrowLeft||keys.a)ax=-1;if(keys.ArrowRight||keys.d)ax=1;if(keys.ArrowUp||keys.w)ay=-1;if(keys.ArrowDown||keys.s)ay=1;
if(!tr&&dist>=T){tr=true;trT=0;flash=1;scream(1.4);txt='ELE NÃO PARA DE CRESCER';txtT=2.5;gap=Math.max(gap,230)}
if(tr)trT+=dt;K=tr?Math.min(1,trT/3.5):0;
slow=Math.max(0,slow-dt);inv=Math.max(0,inv-dt);
const v=Math.min(250+PR*230,470)*(slow>0?.55:1)*(1+Math.max(0,ax)*.18);
dist+=v*dt;px=L_(px,W*.42+ax*W*.18,Math.min(1,dt*6));
gap+=((ax>0?ax*55:ax*35)-(9+PR*14+K*12))*dt;gap=Math.min(gap,400);
if(P.y===0&&ay<-.5){P.vy=720}P.sl=P.y===0&&ay>.5;
if(P.y>0||P.vy>0){P.vy-=2000*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.vy=0}
const ph=P.sl?28:70,wx=dist+px;
if(inv<=0)for(const o of ob){const w=o.t===1?70:(o.t===0?40:34);if(wx+12>o.x&&wx-12<o.x+w){
const hit=o.t===0?P.y<50:o.t===2?P.y<26:(P.y+ph>44&&P.y<64);if(hit){inv=1;slow=1;gap-=85;shake=6;flash=.4}}}
if(dist+px>=L-40){dist=L-40-px;scare('end')}
if(gap<45)scare('caught');
shake=Math.max(shake-dt*10,K>0?2+K*3:0,gap<130?(130-gap)/25:0);
nextTxt-=dt;if(nextTxt<0){txt=words[Math.floor(Math.random()*words.length)];txtT=R(.15,.45);nextTxt=R(2.5,6)}
if(sir){try{sg.gain.value=K*.045;sir.frequency.value=500+Math.sin(time*3)*260}catch(e){}}
}else{scT+=dt;shake=14;if(scT>2.4){st='over';const m=document.getElementById('msg');m.querySelector('h1').textContent=why==='end'?'FIM DA PICADA':'ELE TE PEGOU';
m.querySelector('p').textContent=why==='end'?'A estrada acabou. Não tinha mais pra onde correr. ('+Math.floor(dist/50)+'m)':'Você correu '+Math.floor(dist/50)+'m.';document.getElementById('go').textContent='correr de novo';m.style.display='flex'}}
/* ---------- desenho ---------- */
const kk=K,red=Math.min(1,.25+kk*.5+(st==='scare'?1:0));
const sk=x.createLinearGradient(0,0,0,G);sk.addColorStop(0,'#0d0000');sk.addColorStop(1,'rgb('+Math.floor(70+kk*80+Math.random()*12)+',8,8)');x.fillStyle=sk;x.fillRect(0,0,W,H);
x.fillStyle='#000';x.beginPath();x.arc(W*.72,G*.55,W*.17,0,7);x.fill();x.strokeStyle='#a00';x.lineWidth=3;x.stroke();
x.save();if(shake>0)x.translate(R(-shake,shake),R(-shake,shake));
x.strokeStyle='#050000';x.lineWidth=7;for(let n=0;n<8;n++){const bx=(((n*240-dist*.4)%(W+300))+(W+300))%(W+300)-120,h=140+(n*53%90);x.beginPath();x.moveTo(bx,G);x.lineTo(bx,G-h);x.moveTo(bx,G-h*.6);x.lineTo(bx+40,G-h*.9);x.moveTo(bx,G-h*.75);x.lineTo(bx-38,G-h*1.05);x.stroke()}
x.fillStyle='#000';x.fillRect(0,G,W,H-G);x.fillStyle='#a00';x.fillRect(0,G,W,3);
x.fillStyle='#400';for(let i=-1;i<W/80+2;i++)x.fillRect(i*80-(dist%80),G+30+(i%3)*14,36,3);
for(const o of ob){const sx=o.x-dist+px*0+0;const X=sx;if(X<-100||X>W+100)continue;
if(o.t===0){x.fillStyle='#180000';x.strokeStyle='#e11';x.lineWidth=2;x.fillRect(X,G-50,40,50);x.strokeRect(X,G-50,40,50);x.beginPath();x.moveTo(X,G-50);x.lineTo(X+40,G);x.stroke()}
else if(o.t===2){x.fillStyle='#e11';x.beginPath();x.moveTo(X,G);x.lineTo(X+17,G-28);x.lineTo(X+34,G);x.fill()}
else{x.strokeStyle='#600';x.lineWidth=2;x.beginPath();x.moveTo(X+8,0);x.lineTo(X+8,G-64);x.moveTo(X+62,0);x.lineTo(X+62,G-64);x.stroke();x.fillStyle='#e11';x.fillRect(X,G-64,70,20)}}
const wX=L-dist;if(wX<W+200){x.fillStyle='#000';x.fillRect(wX,0,400,H);x.strokeStyle='#e11';x.lineWidth=4;x.strokeRect(wX,20,380,G-20);x.fillStyle='#e11';x.font='700 '+Math.min(34,W/12)+'px Courier New';x.textAlign='left';x.fillText('FIM DA PICADA',wX-Math.min(250,W*.6)-10,G-110);x.fillText('>>>>>',wX-130,G-70)}
if(st!=='scare'){chaser(time,kk);man(time)}
x.restore();
if(st==='scare'){const hw=Math.max(W,H/asp()*1)*1.2,hh=hw*asp();x.save();x.translate(R(-20,20),R(-20,20));const sl=14,dh=hh/sl,sh=img.naturalHeight/sl;for(let i=0;i<sl;i++)x.drawImage(img,0,i*sh,img.naturalWidth,sh+1,W/2-hw/2+Math.sin(time*25+i)*(20+i*3),H/2-hh/2+i*dh,hw,dh+1);x.restore();x.fillStyle='rgba(255,0,0,'+(.15+Math.random()*.3)+')';x.fillRect(0,0,W,H)}
/* pós */
const vg=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(40,0,0,'+red+')');x.fillStyle=vg;x.fillRect(0,0,W,H);
if(Math.random()<.07+K*.1){for(let i=0;i<3;i++){const y=R(0,H),h=R(8,50);x.drawImage(cv,0,y,W,h,R(-30,30),y,W,h)}}
x.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H;y+=4)x.fillRect(0,y,W,1);
for(let i=0;i<50;i++){x.fillStyle='rgba(255,255,255,'+R(.02,.1)+')';x.fillRect(R(0,W),R(0,H),R(1,3),R(1,3))}
if(flash>0){x.fillStyle='rgba(255,255,255,'+Math.min(.8,flash*.6)+')';x.fillRect(0,0,W,H);flash-=dt}
if(txtT>0&&st==='run'){txtT-=dt;x.font='700 '+Math.min(44,W/9)+'px Courier New';x.textAlign='center';x.fillStyle='#0ff';x.fillText(txt,W/2+3,H*.35+3);x.fillStyle='#e11';x.fillText(txt,W/2-2,H*.35)}
document.getElementById('d').textContent=Math.floor(dist/50)+'m';
document.getElementById('f').textContent=Math.random()<.03?'??? m':'fim: '+Math.max(0,Math.floor((L-dist)/50))+'m'}
requestAnimationFrame(loop);
</script></body></html>
